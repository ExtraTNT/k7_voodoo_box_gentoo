# tmux — C-a prefix, vi keys, quiet amber status line.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 10000
set -sg escape-time 0
setw -g mode-keys vi

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind r source-file ~/.tmux.conf \; display "reloaded"

set -g status-style "bg=#121212,fg=#6c6c6c"
set -g status-left "#[fg=#d7a65f]#S #[default]"
set -g status-right "#H"
setw -g window-status-current-style "fg=#121212,bg=#d7a65f"
setw -g window-status-format " #I #W "
setw -g window-status-current-format " #I #W "
set -g pane-border-style "fg=#303030"
set -g pane-active-border-style "fg=#d7a65f"
