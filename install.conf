# install.conf — the one config file for the Tyan S2466 Gentoo box.
#
# Bash syntax: KEY="value". Values containing '$' (password hashes!) must be in
# 'single quotes'.
#
# Who reads it:
#   * iso/build-iso.sh bakes it into the ISO (stage 1 installer)
#   * the installer copies it to /etc/system.conf on the target (mode 600)
#   * bootstrap.sh (stage 2, from this repo) reads /etc/system.conf
#
# Override without rebuilding the ISO: add  ai.conf=http://server/install.conf
# to the kernel line in the ISO boot menu.

# ── Target disk ─────────────────────────────────────────────────────────────
DISK="/dev/sda"                 # WIPED COMPLETELY (asks first, see AUTO_CONFIRM)
SWAP_SIZE="2GiB"                # swap at the END of the disk; "0" = no swap
ROOT_MKFS_OPTS="-m 1"           # extra mkfs.ext4 options
ROOT_MOUNT_OPTS="noatime,commit=60"
PORTAGE_TMPFS="1536M"           # build in RAM (PATA is slow); "" = build on disk

# ── Identity / locale ───────────────────────────────────────────────────────
HOSTNAME="tiger"
TIMEZONE="UTC"                  # e.g. Europe/Zurich
LOCALE="en_US.UTF-8"
KEYMAP="de_CH-latin1"                     # console keymap, e.g. de_CH-latin1, de-latin1
X_KEYMAP="ch"                   # X layout,  e.g. ch, de
X_KEYVARIANT="de"                 # e.g. de_nodeadkeys
X_KEYOPTIONS="caps:super"       # CapsLock is Meta: the IBM 6323 (Model M era) has no Win key,
                                # and right Alt is AltGr on the Swiss layout

# ── Users ───────────────────────────────────────────────────────────────────
USERNAME="hugisv"
# Hashes from:  openssl passwd -6     (keep the single quotes!)
# Empty = the installer asks interactively before it starts.
USER_PASSWORD_HASH=''
ROOT_PASSWORD_HASH=''           # empty + empty answer = root account locked (use doas)
SSH_AUTHORIZED_KEY=""           # set = sshd enabled, key-only login for $USERNAME
AUTOLOGIN="yes"                 # tty1 autologin + startx (stage 2)

# ── Network / time ──────────────────────────────────────────────────────────
NTP_SERVER="pool.ntp.org"       # the CMOS clock of a 20 y/o board lies -> TLS breaks

# ── Sources ─────────────────────────────────────────────────────────────────
GENTOO_MIRROR="https://distfiles.gentoo.org"
STAGE3_FLAVOR="i686-openrc"     # i686 = no SSE2 required (Athlon MP has none)
STAGE3_URL=""                   # set to pin a stage3 / use a LAN copy
PROFILE="default/linux/x86/23.0/i686"
OFFICIAL_BINHOST="yes"          # Gentoo's x86 binhost (base system pkgs only)

# The repo with "the rest" (this repo). Cloned to /home/$USERNAME/$REPO_NAME.
# Any git host the box can reach (GitHub, GitLab, Codeberg, ...). A private
# repo needs credentials in the URL (https://user:token@...).
REPO_URL="https://github.com/ExtraTNT/k7_voodoo_box_gentoo.git"
REPO_BRANCH="master"
REPO_NAME="system"
# Branch with packages + kernel prebuilt on your PC (build/prebuild.sh,
# build/publish.sh). Stage 2 installs from it instead of compiling. "" = off.
BINPKGS_BRANCH="binpkgs"
FIRSTBOOT_BOOTSTRAP="yes"       # run bootstrap.sh automatically on first boot
FIRSTBOOT_REBOOT="yes"          # reboot when stage 2 is done (into X)

# ── Compiler / Portage ──────────────────────────────────────────────────────
COMMON_FLAGS="-O2 -pipe -march=athlon-mp"
MAKEOPTS="-j3 -l2.5"            # 2 CPUs
CPU_FLAGS_X86="3dnow 3dnowext mmx mmxext sse"
# -rust: Rust on 32-bit x86 needs SSE2, the Athlon MP has none
USE_FLAGS="X alsa -rust -pulseaudio -pipewire -wayland -systemd -gtk -qt5 -qt6 -kde -gnome -bluetooth -cups -introspection -vala -doc"
VIDEO_CARDS="radeon"            # only if a Radeon 9000 is in the AGP slot; the Voodoo 3 runs X via vesa + Glide
INPUT_DEVICES="libinput"
L10N="en"
ACCEPT_LICENSE="-* @FREE @BINARY-REDISTRIBUTABLE"

# ── Kernel / boot ───────────────────────────────────────────────────────────
KERNEL_PKG="sys-kernel/gentoo-sources"
KERNEL_FRAGMENT="kernel/s2466.config"   # relative to the repo root; several = merged in order
# radeon.agpmode=-1 : add if the AMD-762 AGP bus makes the Radeon hang
# mitigations=off   : K7 is barely affected anyway; a little faster
KERNEL_CMDLINE="quiet loglevel=3"
GRUB_TIMEOUT="0"                # 0 = no menu (hold Shift/Esc to get one)
SPLASH="yes"                    # text boot screen (post/): cpus, ram, disks, gpus, net
                                # + kernel warnings/errors; no OpenRC chatter

# ── ISO ─────────────────────────────────────────────────────────────────────
# Firmware the LIVE CD keeps (dirs under /lib/firmware); the rest is dropped to
# make room for the prebuilt kernel + stage-1 packages. The S2466 needs only radeon.
ISO_FIRMWARE_KEEP="radeon"

# ── Safety ──────────────────────────────────────────────────────────────────
AUTO_CONFIRM="no"               # "yes" = wipe DISK without asking. Careful.
